$body$

<link rel="stylesheet" type="text/css" href="/static/spagyria.css" />

<div class="spg" id="spg" data-lang="$language$">

  <p class="spg-disclaimer" data-i18n="disclaimer"></p>

  <div class="spg-toolbar" id="spg-toolbar">
    <div class="spg-tabs" role="tablist">
      <button type="button" role="tab" class="spg-tab" id="spg-tab-piante" data-view="piante" aria-selected="true" data-i18n="tabPlants"></button>
      <button type="button" role="tab" class="spg-tab" id="spg-tab-disturbi" data-view="disturbi" aria-selected="false" data-i18n="tabIndications"></button>
    </div>

    <div class="spg-search">
      <input type="search" id="spg-q" autocomplete="off" data-i18n-placeholder="searchPlaceholder" />
      <button type="button" class="spg-clear" id="spg-clear" data-i18n-title="clear" hidden>✕</button>
    </div>

    <div class="spg-filters">
      <div class="spg-planets" id="spg-planets" role="group"></div>
      <div class="spg-row">
        <span class="spg-count" id="spg-count" aria-live="polite"></span>
        <span class="spg-actions" id="spg-plant-actions">
          <select id="spg-sort" data-i18n-title="sort">
            <option value="az" data-i18n="sortAz"></option>
            <option value="seq" data-i18n="sortSeq"></option>
          </select>
          <button type="button" class="spg-link" id="spg-expand" data-i18n="expandAll"></button>
          <button type="button" class="spg-link" id="spg-collapse" data-i18n="collapseAll"></button>
        </span>
      </div>
    </div>
  </div>

  <div id="spg-view-piante">
    <nav class="spg-index" id="spg-index" data-i18n-aria-label="index"></nav>
    <div id="spg-cards"></div>
  </div>

  <div id="spg-view-disturbi" hidden>
    <div id="spg-indications"></div>
  </div>

  <p class="spg-empty" id="spg-empty" data-i18n="noResults" hidden></p>

  <button type="button" class="spg-top" id="spg-top" data-i18n-title="backToTop" hidden>↑</button>
</div>

<script src="/static/spagyria.js"></script>
